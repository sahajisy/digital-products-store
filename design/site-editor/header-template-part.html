<style>
/* ===== wabisabivibes header (Site Editor template part: Header) ===== */
header.wp-block-template-part{position:sticky;top:0;z-index:50}
.admin-bar header.wp-block-template-part{top:32px}
.wsv-announce p{margin:0;letter-spacing:.01em}
.wsv-bar{background:#FFFAF5;border-bottom:1px solid #EAD9CC;padding:0 32px;min-height:76px;gap:24px}
.wsv-logo{margin:0}
.wsv-logo img{width:210px;height:auto;display:block}
.wsv-nav{flex:1}
.wsv-nav .wp-block-navigation-item__content{font:700 14px/1.2 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#2E2A26;text-decoration:none;padding:9px 11px;border-radius:999px;transition:color .18s ease,background-color .18s ease}
.wsv-nav .wp-block-navigation-item__content:hover,.wsv-nav .wp-block-navigation-item__content[aria-current]{color:#C45B44}
.wsv-nav .wsv-top>.wp-block-navigation-item__content[aria-current]::before{content:"\273F";color:#F7B8B8;margin-right:5px}
.wsv-nav .wp-block-navigation__submenu-container{background:#FFFAF5!important;color:#2E2A26!important;border:1px solid #EAD9CC!important;border-radius:16px;box-shadow:0 10px 30px rgba(46,42,38,.08);padding:8px!important;min-width:220px}
.wsv-nav .wp-block-navigation__submenu-container .wp-block-navigation-item__content{border-radius:10px;padding:9px 12px;font-weight:600}
.wsv-nav .wp-block-navigation__submenu-container .wp-block-navigation-item__content:hover{background:#FDECEC;color:#C45B44}
.wsv-nav .wp-block-navigation__submenu-container::after{content:"\273F";position:absolute;right:14px;top:-11px;color:#F7B8B8;font-size:15px;line-height:1;background:#FFFAF5;padding:0 3px;border-radius:50%}
.wsv-actions{gap:4px;flex-wrap:nowrap}
.wsv-search .wp-block-search__button,.wsv-cart .wc-block-mini-cart__button,.wsv-account a{color:#2E2A26;background:transparent;border:0;border-radius:50%;padding:8px;transition:background-color .18s ease}
.wsv-search .wp-block-search__button:hover,.wsv-cart .wc-block-mini-cart__button:hover,.wsv-account a:hover{background:#FDECEC}
.wsv-cart .wc-block-mini-cart__badge{background:#C45B44;color:#fff}
.wsv-bar :focus-visible{outline:2px solid #2E2A26;outline-offset:2px;border-radius:8px}
.wsv-mobile-only{display:none}
.wp-block-navigation__responsive-container.is-menu-open .wsv-mobile-only{display:block}
.wsv-nav .wp-block-navigation__responsive-container.is-menu-open{background:#FFFAF5;padding:24px}
.wsv-nav .is-menu-open .wsv-top>.wp-block-navigation-item__content{font-size:18px}
.wsv-nav .is-menu-open .wp-block-navigation-item__content:hover{background:#FDECEC}
.wsv-nav .is-menu-open .wp-block-navigation-submenu__toggle[aria-expanded="false"]~.wp-block-navigation__submenu-container{display:none!important}
.wsv-nav .is-menu-open .wsv-mobile-only>.wp-block-navigation-item__content{background:#C45B44;color:#fff;border-radius:999px;padding:11px 18px;display:inline-block;margin-top:6px}
@media (max-width:1023px){
 .wsv-bar{display:grid!important;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;min-height:68px}
 .wsv-nav{order:-1;justify-self:start;flex:none}
 .wsv-logo{justify-self:center}
 .wsv-logo img{width:180px}
 .wsv-actions{justify-self:end}
 .wsv-account{display:none}
 .wsv-nav .wp-block-navigation__responsive-container:not(.is-menu-open){display:none!important}
 .wsv-nav .wp-block-navigation__responsive-container-open:not(.always-shown){display:flex!important}
}
@media (max-width:600px){.wsv-logo img{width:160px}}
/* Elementor pages inside Twenty Twenty-Five: no duplicate title, full width */
body.elementor-page .wp-block-post-title,body.elementor-page .wp-block-post-featured-image{display:none}
body.elementor-page main.wp-block-group{margin-top:0!important}
body.elementor-page main.wp-block-group>.wp-block-group{padding-top:0!important;padding-bottom:0!important}
body.elementor-page .wp-block-post-content>.elementor{max-width:none!important;width:100%}
</style>
